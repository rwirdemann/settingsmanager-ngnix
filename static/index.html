<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SettingsManager Web</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  .endpoints {
    list-style: none;
    margin: 0 0 1.5rem;
    padding: 0.75rem 1rem;
    background: #f4f4f4;
    font-size: 0.8125rem;
  }
  .endpoints li + li {
    margin-top: 0.3rem;
  }
  .endpoints code {
    font-weight: 600;
  }
  input#service {
    font-family: monospace;
    font-size: 0.875rem;
    padding: 0.25rem 0.4rem;
    margin: 0 0 0.75rem 0.4rem;
  }
  textarea {
    width: 100%;
    height: 320px;
    font-family: monospace;
    font-size: 0.75rem;
    box-sizing: border-box;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
  }
  pre {
    background: #f4f4f4;
    padding: 1rem;
    font-size: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .error {
    color: #b00020;
  }
</style>
</head>
<body>
  <h1>SettingsManager Web</h1>
  <ul class="endpoints">
    <li><code>GET /services/{service}/config</code> — fetch the config
      the service currently holds</li>
    <li><code>PUT /services/{service}/config</code> — submit a new
      config</li>
    <li><code>GET /transactions/{transactionID}</code> — poll the
      status of a transaction</li>
  </ul>
  <label for="service">Service</label>
  <input id="service" value="modbus" autocomplete="off">
  <textarea id="payload"
    placeholder="Click GET to fetch the config the settingsmanager currently holds for the service, then edit it and click PUT."></textarea>
  <button id="get">GET</button>
  <button id="put">PUT</button>
  <h2>Response</h2>
  <pre id="result">–</pre>
  <h2>Confirmation</h2>
  <pre id="confirmation">–</pre>

  <script>
    const textarea = document.getElementById('payload');
    const serviceInput = document.getElementById('service');
    const result = document.getElementById('result');
    const confirmation = document.getElementById('confirmation');
    let pollTimer = null;

    // pollInterval is how often the frontend polls
    // /transactions/{transactionID} while a transaction is
    // still "received".
    const pollInterval = 1000;
    const initialPollDelay = 2000;

    // randomUUID returns a random v4 UUID. crypto.randomUUID is only
    // available in secure contexts (https or localhost), so fall back
    // to building one from crypto.getRandomValues.
    function randomUUID() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
      return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' +
        hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
    }

    // configURL builds the /services/{service}/config path the
    // settingsmanager exposes for reading and writing a config.
    function configURL(service) {
      return '/services/' + encodeURIComponent(service) + '/config';
    }

    // currentService returns the service named in the input field.
    // It is the path segment of both endpoints, so without it there
    // is nothing to address.
    function currentService() {
      return serviceInput.value.trim();
    }

    // statusNames maps the numeric Status the settingsmanager sends
    // onto the names from its Status enum.
    const statusNames = ['received', 'applied', 'error', 'discarded'];

    // normalizeConfirmation replaces the raw enum number the
    // settingsmanager sends as "status" with its name, so the
    // panel shows "applied" rather than 1. All other fields are
    // passed through unchanged.
    function normalizeConfirmation(obj) {
      return {
        ...obj,
        status: statusNames[obj.status] ?? obj.status,
      };
    }

    // pollConfirmation polls GET /transactions/{transactionID}
    // every pollInterval ms and updates the confirmation panel,
    // until the status is no longer "received".
    function pollConfirmation(transactionId) {
      if (pollTimer) clearTimeout(pollTimer);
      confirmation.classList.remove('error');
      confirmation.textContent = 'polling …';

      const tick = async () => {
        try {
          const res = await fetch('/transactions/' +
            encodeURIComponent(transactionId),
            { headers: { 'Accept': 'application/json' } });

          if (!res.ok) {
            const text = await res.text();
            confirmation.textContent =
              res.status + ' ' + res.statusText + '\n' + text;
            confirmation.classList.add('error');
            return;
          }

          const obj = normalizeConfirmation(await res.json());
          confirmation.textContent = JSON.stringify(obj, null, 2);
          if (obj.status === 'received') {
            pollTimer = setTimeout(tick, pollInterval);
          }
        } catch (e) {
          confirmation.textContent = 'Polling failed: ' + e.message;
          confirmation.classList.add('error');
        }
      };

      pollTimer = setTimeout(tick, initialPollDelay);
    }

    // The GET button fetches the config the settingsmanager
    // currently holds for the service and puts it into the textarea,
    // ready to be edited and sent back.
    document.getElementById('get').addEventListener('click', async () => {
      result.textContent = '…';
      result.classList.remove('error');

      const service = currentService();
      if (!service) {
        result.textContent = 'Missing service name';
        result.classList.add('error');
        return;
      }

      try {
        const res = await fetch(configURL(service),
          { headers: { 'Accept': 'application/json' } });

        const text = await res.text();
        if (!res.ok) {
          result.textContent =
            res.status + ' ' + res.statusText + '\n' + text;
          result.classList.add('error');
          return;
        }

        const obj = JSON.parse(text);

        // Stamp a fresh transaction ID so the loaded config can go
        // straight back out as a new transaction instead of reusing
        // the ID of the one that last wrote it.
        obj.transaction_id = randomUUID();
        if (obj.details) {
          obj.details.transaction_id = obj.transaction_id;
        }

        textarea.value = JSON.stringify(obj, null, 2);
        result.textContent = res.status + ' ' + res.statusText;
      } catch (e) {
        result.textContent = 'Request failed: ' + e.message;
        result.classList.add('error');
      }
    });

    // The PUT button submits the textarea content as a new config
    // and then polls the resulting transaction.
    document.getElementById('put').addEventListener('click', async () => {
      result.textContent = '…';
      result.classList.remove('error');
      confirmation.textContent = '–';
      confirmation.classList.remove('error');
      if (pollTimer) clearTimeout(pollTimer);

      const service = currentService();
      if (!service) {
        result.textContent = 'Missing service name';
        result.classList.add('error');
        return;
      }

      if (!textarea.value.trim()) {
        result.textContent = 'Nothing to send — click GET first';
        result.classList.add('error');
        return;
      }

      let input;
      try {
        input = JSON.parse(textarea.value);
      } catch (e) {
        result.textContent = 'Invalid JSON: ' + e.message;
        result.classList.add('error');
        return;
      }

      const details = input.details || {};

      // A payload typed from scratch carries no transaction ID, so
      // mint one here. It has to exist before the request goes out,
      // because it is what the confirmation is polled by.
      const transactionId = input.transaction_id || randomUUID();
      details.transaction_id = transactionId;

      // Same for service_name: a payload typed from scratch has
      // none. It is taken from the Service field, which also forms
      // the path segment, so body and URL cannot disagree.
      input.service_name = service;

      // GET /services/{service}/config does not return neonpulse_ids,
      // so fall back to the ID carried inside the config itself.
      const neonpulseID = (input.neonpulse_ids && input.neonpulse_ids[0]) ||
        details.neonpulse_id || '';

      try {
        const body = JSON.stringify({
          created_at: new Date().toISOString(),
          transaction_id: transactionId,
          service_name: service,
          neonpulse_ids: input.neonpulse_ids || [neonpulseID],
          details,
        });

        const res = await fetch(configURL(service), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Message-Type': 'config',
            'X-Neonpulse-Id': neonpulseID,
          },
          body,
        });

        if (!res.ok) {
          const text = await res.text();
          result.textContent =
            res.status + ' ' + res.statusText + '\n' + text;
          result.classList.add('error');
          return;
        }

        const obj = normalizeConfirmation(await res.json());
        result.textContent = res.status + ' ' + res.statusText +
          '\n' + JSON.stringify(obj, null, 2);

        pollConfirmation(transactionId);

        // Stamp the textarea with a fresh transaction ID so the
        // next click starts a new transaction instead of resending
        // the one currently being polled. Edits to the rest of the
        // payload are kept.
        input.transaction_id = randomUUID();
        if (input.details) {
          input.details.transaction_id = input.transaction_id;
        }
        textarea.value = JSON.stringify(input, null, 2);
      } catch (e) {
        result.textContent = 'Request failed: ' + e.message;
        result.classList.add('error');
      }
    });
  </script>
</body>
</html>
