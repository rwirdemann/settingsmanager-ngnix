<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON Submit Demo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  textarea {
    width: 100%;
    height: 320px;
    font-family: monospace;
    font-size: 0.75rem;
    box-sizing: border-box;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
  }
  pre {
    background: #f4f4f4;
    padding: 1rem;
    font-size: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .error {
    color: #b00020;
  }
</style>
</head>
<body>
  <h1>Send ModbusConfig</h1>
  <textarea id="payload"></textarea>
  <button id="send">Send</button>
  <h2>Response</h2>
  <pre id="result">–</pre>
  <h2>Confirmation</h2>
  <pre id="confirmation">–</pre>

  <script>
    const textarea = document.getElementById('payload');
    const result = document.getElementById('result');
    const confirmation = document.getElementById('confirmation');
    let pollTimer = null;

    // pollInterval is how often the frontend polls
    // /transactions/{transactionID} while a transaction is
    // still "received".
    const pollInterval = 1000;
    const initialPollDelay = 13000;

    // randomUUID returns a random v4 UUID. crypto.randomUUID is only
    // available in secure contexts (https or localhost), so fall back
    // to building one from crypto.getRandomValues.
    function randomUUID() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
      return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' +
        hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
    }

    // defaultPayload builds the example ModbusConfig request shown in
    // the textarea, stamped with a fresh transaction ID.
    function defaultPayload(transactionId) {
      return {
        transaction_id: transactionId,
        service_name: 'modbus',
        neonpulse_ids: ['1234'],
        modbus_config: {
          transaction_id: transactionId,
          neonpulse_id: '1234',
          kontext: 'anlage-1',
          serial: [
            {
              url: 'tcp://localhost:502',
              timeout: 300,
              speed: 19200,
              data_bits: 8,
              // parity: 0 = none, 1 = even, 2 = odd
              parity: 1,
              stop_bits: 1,
              slaves: [
                {
                  address: 111,
                  name: 111,
                  type: 'trafo-integrated',
                  hardware_maker: '',
                  hardware_model: '',
                  leittechnikkomponente: 1,
                  spannungsebene_teilanlage: '',
                  fw_version: '1.0',
                  rebirth: false,
                  scan_rate: 60,
                  use_iec_104_thresholds: false,
                },
              ],
            },
          ],
        },
      };
    }

    textarea.value = JSON.stringify(defaultPayload(randomUUID()), null, 2);

    // statusNames maps the numeric Status the settingsmanager sends
    // onto the names from its Status enum.
    const statusNames = ['received', 'applied', 'error', 'discarded'];

    // normalizeConfirmation replaces the raw enum number the
    // settingsmanager sends as "status" with its name, so the
    // panel shows "applied" rather than 1. All other fields are
    // passed through unchanged.
    function normalizeConfirmation(obj) {
      return {
        ...obj,
        status: statusNames[obj.status] ?? obj.status,
      };
    }

    // pollConfirmation polls GET /transactions/{transactionID}
    // every pollInterval ms and updates the confirmation panel,
    // until the status is no longer "received".
    function pollConfirmation(transactionId) {
      if (pollTimer) clearTimeout(pollTimer);
      confirmation.classList.remove('error');
      confirmation.textContent = 'polling …';

      const tick = async () => {
        try {
          const res = await fetch('/transactions/' +
            encodeURIComponent(transactionId),
            { headers: { 'Accept': 'application/json' } });

          if (!res.ok) {
            const text = await res.text();
            confirmation.textContent =
              res.status + ' ' + res.statusText + '\n' + text;
            confirmation.classList.add('error');
            return;
          }

          const obj = normalizeConfirmation(await res.json());
          confirmation.textContent = JSON.stringify(obj, null, 2);
          if (obj.status === 'received') {
            pollTimer = setTimeout(tick, pollInterval);
          }
        } catch (e) {
          confirmation.textContent = 'Polling failed: ' + e.message;
          confirmation.classList.add('error');
        }
      };

      pollTimer = setTimeout(tick, initialPollDelay);
    }

    document.getElementById('send').addEventListener('click', async () => {
      result.textContent = '…';
      result.classList.remove('error');
      confirmation.textContent = '–';
      confirmation.classList.remove('error');
      if (pollTimer) clearTimeout(pollTimer);

      let input;
      try {
        input = JSON.parse(textarea.value);
      } catch (e) {
        result.textContent = 'Invalid JSON: ' + e.message;
        result.classList.add('error');
        return;
      }

      const neonpulseID =
        (input.neonpulse_ids && input.neonpulse_ids[0]) || '';

      try {
        const body = JSON.stringify({
          created_at: new Date().toISOString(),
          transaction_id: input.transaction_id,
          service_name: input.service_name,
          neonpulse_ids: input.neonpulse_ids,
          details: input.modbus_config || {},
        });

        const res = await fetch('/config/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Message-Type': 'config',
            'X-Neonpulse-Id': neonpulseID,
          },
          body,
        });

        if (!res.ok) {
          const text = await res.text();
          result.textContent =
            res.status + ' ' + res.statusText + '\n' + text;
          result.classList.add('error');
          return;
        }

        const obj = normalizeConfirmation(await res.json());
        result.textContent = res.status + ' ' + res.statusText +
          '\n' + JSON.stringify(obj, null, 2);

        pollConfirmation(input.transaction_id);

        // Stamp the textarea with a fresh transaction ID so the
        // next click starts a new transaction instead of resending
        // the one currently being polled. Edits to the rest of the
        // payload are kept.
        input.transaction_id = randomUUID();
        if (input.modbus_config) {
          input.modbus_config.transaction_id = input.transaction_id;
        }
        textarea.value = JSON.stringify(input, null, 2);
      } catch (e) {
        result.textContent = 'Request failed: ' + e.message;
        result.classList.add('error');
      }
    });
  </script>
</body>
</html>
